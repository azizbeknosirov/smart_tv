<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirish</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  form { background: #fff; padding: 24px; border-radius: 12px; width: 280px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  h2 { margin-bottom: 16px; text-align: center; }
  input { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #ccc; border-radius: 8px; }
  button { width: 100%; padding: 12px; margin-top: 16px; background: #2196f3; color: #fff; border: none; border-radius: 8px; font-size: 16px; }
  .error { color: #e53935; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<form method="post">
  {% csrf_token %}
  <h2>Kafe paneli</h2>
  <input type="text" name="username" placeholder="Login" required>
  <input type="password" name="password" placeholder="Parol" required>
  <button type="submit">Kirish</button>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
</form>
</body>
</html>
