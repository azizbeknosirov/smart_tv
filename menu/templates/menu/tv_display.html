<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Menyu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #14100c;
    --card-bg: #221a12;
    --card-img-bg: #191410;
    --gold: #e8b04b;
    --gold-soft: #d99a3d;
    --cream: #f5ead8;
    --muted: #a89880;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Segoe UI', Georgia, serif;
    overflow: hidden;
  }

  /* Fon rasmi (admin paneldan) — to'liq va o'zgarmas ko'rinadi */
  #bg-image {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: var(--bg);
    z-index: 0;
    display: none;
  }
  .page { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; }

  /* Sarlavha */
  header {
    text-align: center;
    padding: 26px 20px 10px;
    flex-shrink: 0;
  }
  header .line {
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  header .rule { height: 2px; width: 90px; background: linear-gradient(90deg, transparent, var(--gold)); border-radius: 2px; }
  header .rule:last-child { background: linear-gradient(270deg, transparent, var(--gold)); }
  h1 {
    font-size: 44px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 600;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
  }
  header .sub {
    margin-top: 4px;
    color: var(--muted);
    font-size: 16px;
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  /* Menyu grid */
  .grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 26px;
    padding: 24px 48px 40px;
    align-content: start;
  }
  .grid::-webkit-scrollbar { width: 8px; }
  .grid::-webkit-scrollbar-thumb { background: rgba(232,176,75,.35); border-radius: 8px; }

  .card {
    background: var(--card-bg);
    border: 1px solid rgba(232, 176, 75, .22);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 26px rgba(0,0,0,.45);
    animation: fadeIn .5s ease both;
    transition: transform .25s ease, border-color .25s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: rgba(232,176,75,.55); }

  /* Rasm maydoni — rasm TO'LIQ ko'rinadi (qirqilmaydi) */
  .img-wrap {
    height: 230px;
    background:
      radial-gradient(ellipse at center, rgba(232,176,75,.08), transparent 65%),
      var(--card-img-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-bottom: 1px solid rgba(232,176,75,.18);
  }
  .img-wrap img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  .info { padding: 16px 20px 18px; text-align: center; }
  .info h2 { font-size: 23px; font-weight: 600; color: var(--cream); margin-bottom: 8px; }
  .price {
    display: inline-block;
    font-size: 22px;
    font-weight: bold;
    color: var(--gold);
    background: rgba(232,176,75,.12);
    border: 1px solid rgba(232,176,75,.3);
    padding: 4px 18px;
    border-radius: 999px;
  }
  .price small { font-size: 14px; font-weight: normal; color: var(--muted); }

  .empty {
    text-align: center; padding: 120px 20px; font-size: 28px; color: var(--muted);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<img id="bg-image" alt="">
<div class="page">
  <header>
    <div class="line">
      <div class="rule"></div>
      <h1 id="cafe-name">SUSAMBIL</h1>
      <div class="rule"></div>
    </div>
    <div class="sub">Milliy taomlar choyxonasi</div>
  </header>
  <div id="menu-grid" class="grid"></div>
  <div id="empty-msg" class="empty" style="display:none;">Hozircha menyu bo'sh</div>
</div>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function loadSettings() {
  try {
    const res = await fetch('/api/tv-settings/');
    const s = await res.json();
    document.getElementById('cafe-name').textContent = s.cafe_name || 'SUSAMBIL';
    document.title = s.cafe_name || 'SUSAMBIL';
    const bg = document.getElementById('bg-image');
    if (s.background_image) {
      bg.src = s.background_image;
      bg.style.display = 'block';
    } else {
      bg.style.display = 'none';
    }
  } catch (e) { /* sozlamalar yuklanmasa ham menyu ishlayveradi */ }
}

let lastSignature = '';

async function loadMenu() {
  try {
    const res = await fetch('/api/tv-menu/');
    const items = await res.json();
    const grid = document.getElementById('menu-grid');
    const empty = document.getElementById('empty-msg');
    const signature = JSON.stringify(items);
    if (signature === lastSignature) return; // o'zgarmasa qayta chizmaymiz (animatsiya uchun)
    lastSignature = signature;

    if (items.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    grid.innerHTML = items.map((item, i) => `
      <div class="card" style="animation-delay:${Math.min(i * 60, 600)}ms">
        <div class="img-wrap"><img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)}"></div>
        <div class="info">
          <h2>${escapeHtml(item.name)}</h2>
          <div class="price">${Number(item.price).toLocaleString('uz-UZ')} <small>so'm</small></div>
        </div>
      </div>
    `).join('');
  } catch (e) {
    console.error('Menyuni yuklashda xatolik:', e);
  }
}

loadSettings();
loadMenu();
setInterval(loadMenu, 10000);   // har 10 soniyada menyu yangilanadi
setInterval(loadSettings, 60000); // sozlamalarni ham tekshirib turadi
</script>
</body>
</html>
